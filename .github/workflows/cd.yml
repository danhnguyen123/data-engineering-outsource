name: CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy-vm:
    name: Deploy to VM via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to VM using SSH and deploy code
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd data-engineering-outsource
            git pull origin main

  deploy-cloud-function:
    name: Deploy Google Cloud Function
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # full history, so the pushed commit range can be diffed

      - name: Check for changes in Cloud Function source
        id: check_changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          echo "Checking for changes in functions/myspa-etl/ between ${BEFORE} and ${GITHUB_SHA}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Previous commit not available (new branch or force push) -> deploy."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- functions/myspa-etl; then
            echo "No changes detected in Cloud Function source."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_changes.outputs.changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_WORKLOAD_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        if: steps.check_changes.outputs.changed == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
            project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy Cloud Function
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          cd functions/myspa-etl
          gcloud functions deploy myspa-etl \
            --runtime python311 \
            --trigger-resource myspa \
            --trigger-event google.storage.object.finalize \
            --entry-point main \
            --region asia-southeast1 \
            --memory 512MB \
            --source . \
            --timeout=540s \
            --max-instances=1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --service-account ${{ secrets.GCP_SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --set-env-vars "DISCORD_WEBHOOK=${{ secrets.DISCORD_WEBHOOK }}"